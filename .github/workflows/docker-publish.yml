name: Build and publish Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Each platform builds on a runner of its own architecture. Building arm64
  # under QEMU on an amd64 runner kept segfaulting the compiler on native gems.
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: applelink
            dockerfile: ./Dockerfile
          - name: applelink-dev
            dockerfile: ./dev.Dockerfile
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the default branch publishes; a manual run on another branch just builds.
      - name: Build and publish Docker image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: |
            ${{ env.REGISTRY }}/tramlinehq/${{ matrix.image.name }}:latest-${{ matrix.platform.arch }}

  # Join the per-architecture images under the one tag everything pulls.
  manifest:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [applelink, applelink-dev]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch tag
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/tramlinehq/${{ matrix.image }}:latest" \
            "$REGISTRY/tramlinehq/${{ matrix.image }}:latest-amd64" \
            "$REGISTRY/tramlinehq/${{ matrix.image }}:latest-arm64"
