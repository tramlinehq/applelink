name: Build and publish Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # One image per kind, each built on a runner of its own architecture:
  # the production image for the amd64 servers, the dev image for arm64 laptops.
  docker:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: applelink
            dockerfile: ./Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: applelink-dev
            dockerfile: ./dev.Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the default branch publishes; a manual run on another branch just builds.
      - name: Build and publish Docker image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: |
            ${{ env.REGISTRY }}/tramlinehq/${{ matrix.image }}:latest
